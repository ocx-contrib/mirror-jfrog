extends: ../mirror-base.yml

name: jfrog-cli

# Logical index package `jfrog/jfrog-cli` at the physical path
# `ghcr.io/ocx-contrib/jfrog/jfrog-cli` — slash segments, never hyphen-flattened.
# The first segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repo the workflow runs in.
#
# The namespace is the vendor (JFrog) and the package is the product, JFrog CLI,
# even though the binary it installs is named `jf`. The binary name is an
# implementation detail of the product, recorded in metadata.json's `binaries`.
#
# Succeeds the flat `ocx.sh/jfrog-cli` coordinate this repository published
# before the grouped layout.
target:
  registry: ghcr.io
  repository: ocx-contrib/jfrog/jfrog-cli

# JFrog ships no GitHub release assets — the binaries live under an HTML
# directory index on releases.jfrog.io, one folder per version, one folder per
# platform, each holding a single raw `jf` / `jf.exe`. scripts/generate.py
# scrapes that index and emits a url_index.
#
# `command` resolves against THIS spec's directory, so the path is
# `scripts/generate.py` and not `jfrog-cli/scripts/generate.py`.
source:
  type: url_index
  generator:
    command: ["uv", "run", "scripts/generate.py"]
    timeout_seconds: 240

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# JFrog CLI is a pure-Go binary built without cgo, so upstream ships ONE Linux
# build per arch and it is fully static. Measured 2026-08-01 on 2.117.0:
#
#   $ file jfrog-cli-linux-amd64/jf
#   ELF 64-bit LSB executable, x86-64, statically linked, Go BuildID=…
#   $ readelf -l … | grep INTERP  → (none)
#   $ readelf -d … | grep NEEDED  → (none)
#   $ file jfrog-cli-linux-arm64/jf
#   ELF 64-bit LSB executable, ARM aarch64, statically linked, Go BuildID=…
#   (same: no PT_INTERP, no DT_NEEDED)
#
# No PT_INTERP and no DT_NEEDED means the artifact requires nothing of the host,
# so both Linux keys are BARE — no `+libc.*` suffix. Upstream publishes no
# musl/alpine variant, so there is no counterpart to split against. Container
# legs (ubuntu + alpine + fedora) live in ../mirror-base.yml and are what turn
# that claim into evidence.
#
# ─── Asset naming ───────────────────────────────────────────────────────────
#
# scripts/generate.py flattens each JFrog platform directory + binary into a
# single asset filename, `<platform-dir>-<binary>` — the pipeline treats an
# asset name as a filename in its work directory, so it must carry no separator.
#
# JFrog's macOS Intel build lives under `jfrog-cli-mac-386`. That directory is
# the 64-bit Intel (amd64) binary despite the name — a historical quirk, not a
# 32-bit build — so it maps to darwin/amd64.
#
# Scope: upstream also publishes linux-{386,arm,ppc64,ppc64le,s390x}, none of
# which has a GitHub runner. The generator's PLATFORMS map is what keeps those
# out of the index; the anchored ^…$ regexes here are the second gate. Resolution
# verified BOTH ways across EVERY in-range version (all 19 of 2.100.0 … 2.117.0):
# each of the five patterns matches EXACTLY one asset. A pattern matching zero is
# silently skipped, not an error — it would yield a green run with a missing
# platform.
assets:
  linux/amd64:
    - "^jfrog-cli-linux-amd64-jf$"
  linux/arm64:
    - "^jfrog-cli-linux-arm64-jf$"
  darwin/amd64:
    - "^jfrog-cli-mac-386-jf$"
  darwin/arm64:
    - "^jfrog-cli-mac-arm64-jf$"
  windows/amd64:
    - "^jfrog-cli-windows-amd64-jf\\.exe$"

asset_type:
  # Raw binary on every platform — no archive to unpack. The pipeline drops the
  # binary into the content root under `name`; on Windows the `.exe` is appended
  # automatically from the asset name, so one metadata file serves all five
  # platforms.
  type: binary
  name: jf

metadata:
  default: metadata.json

catalog:
  # Resolves against this spec's own directory, which also keeps the logo inside
  # this workflow's `jfrog-cli/**` path trigger — a repo-root logo.* sits in no
  # path filter and replacing it would publish nothing. CATALOG.md is found by
  # the default probe beside this file.
  logo: logo.svg

versions:
  min: "2.100.0"
  new_per_run: 5
  poll_interval: "0 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT, not from this spec's own
  # directory — the opposite of `metadata.*` and `catalog.*` above.
  - name: smoke
    script: jfrog-cli/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/jfrog/jfrog-cli/license --jq '.license.spdx_id'
  #   Apache-2.0
  org.opencontainers.image.licenses: "Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: jfrog/jfrog-cli
  fork: ocx-contrib/index
