#:schema https://ocx.sh/schemas/project/v1.json
# OCX project toolchain for the mirror-jfrog sibling repo.
#
# `uv` is the runtime for the PEP 723 generator script
# (`jfrog-cli/scripts/generate.py`) — without it `discover` dies before it reads
# a single version. Namespaced coordinate only: the flat `ocx.sh/uv` dies with
# the `ocx.sh` host.
[tools]
task = "ocx.sh/go-task/task:3.53.1"
cli = "ocx.sh/ocx/cli:0.6"
mirror = "ocx.sh/ocx/mirror:0.6"
uv = "ocx.sh/astral-sh/uv:0"

[group.lint.tools]
uv = "ocx.sh/astral-sh/uv:0.13.0"
grim = "ocx.sh/grimoire/cli:0.14.3"
actionlint = "ocx.sh/actionlint/actionlint:1.7.12"
gitleaks = "ocx.sh/gitleaks/gitleaks:8.30.1"
prek = "ocx.sh/prek/prek:0.5.5"

[group.release.tools]
git-cliff = "ocx.sh/git-cliff/git-cliff:2.14.2"
